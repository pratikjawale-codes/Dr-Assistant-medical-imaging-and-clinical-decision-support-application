[project]
name = "medical-imaging-and-clinical-decision-support-application"
version = "0.1.0"
description = "A local medical-imaging workflow and clinical decision-support prototype."
readme = "README.md"
authors = [
    { name = "pratikjawale-codes", email = "psjawale79@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "pydantic>=2.6.0,<3.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "pydicom>=2.4.4",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
